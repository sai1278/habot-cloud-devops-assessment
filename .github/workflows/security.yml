name: "Security & Secret Detection"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly audit scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: "Gate: Secret Detection (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fail-Closed: Any discovered credential immediately halts workflow
      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  iac-vulnerability-scan:
    name: "Gate: IaC Security & Misconfiguration Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v6

      # Fail-Closed: High and Critical vulnerabilities trigger exit-code 1
      - name: "Run Trivy IaC Scan"
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "config"
          scan-ref: "terraform"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
